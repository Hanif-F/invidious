name: Documentation

on: [push, pull_request]

permissions:
  contents: read

jobs:
  handbook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source references, local links and handbook reachability
        run: python3 docs/tools/check_docs.py
      - name: Check whitespace
        env:
          DOCUMENTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DOCUMENTATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$DOCUMENTATION_BASE" ] &&
             [ "$DOCUMENTATION_BASE" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "$DOCUMENTATION_BASE^{commit}" 2>/dev/null; then
            git diff --check "$DOCUMENTATION_BASE" "$DOCUMENTATION_HEAD"
          else
            git show --check --format= "$DOCUMENTATION_HEAD"
          fi
